<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>FrotaMaq</title>
    <script>
      // GitHub Pages project site: /FrotaMaq/<rota> → /FrotaMaq/?/<rota>
      // index.html restaura o path com history.replaceState (SPA F5).
      (function () {
        var pathSegmentsToKeep = 1
        var location = window.location
        var prefix = location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')
        var rest = location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~')
        var query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : ''
        location.replace(
          location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
          prefix + '/?/' + rest + query + location.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
